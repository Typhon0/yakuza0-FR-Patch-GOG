- id: boot_heat_eye_slows_down
  en: |-
    Heat Eye slows down the action. Using it
    depletes the Heat Eye gauge shown under
    your HP bar. The gauge refills over time.
  fr: |-
    L'Oeil Heat ralentit le temps. L'utiliser
    vide la jauge Heat sous vos PV.
    La jauge se remplit avec le temps.
- id: boot_withdraw_into_the_car
  en: |-
    Withdraw into the car to reload.
    Hold <Sign:3> to stay inside the car.
    While inside, Kiryu will not get hit,
    but the car will take damage instead.
    It's game over if the car's HP reaches 0.
  fr: |-
    S'abriter dans la voiture pour recharger.
    Maintenir <Sign:3> pour rester a l'abri.
    Kiryu sera protege mais la voiture
    subira les degats a sa place.
    Fin de partie si les PV tombent a 0.
