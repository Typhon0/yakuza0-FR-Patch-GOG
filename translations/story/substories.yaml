- id: wdr_i_dont_even_have
  en: "...I don't even have that much. I really need to get some\r\nmoney first."
  fr: '...Je n''ai meme pas assez. Il me faut de l''argent.'
- id: wdr_ill_pass_for_now
  en: I'll pass for now.
  fr: Je passe mon tour.
- id: wdr_thats_what_i_call
  en: That's what I call singing. You outdid the original singer.
  fr: Ca c'est chanter ! Meilleur que l'original.
- id: wdr_only_because_you_were
