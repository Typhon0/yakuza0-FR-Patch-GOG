  fr: Bof, passable.
- id: wdr_no_you_were_very
  en: No, you were very good! I loved it!
  fr: Non, tu as assure ! J'ai adore !
- id: wdr_if_wielded_properly_the
  en: "If wielded properly, the nunchaku can slip past the enemy's\r\ndefenses. The\
    \ trick is to hook it around them."
  fr: "Bien manie, le nunchaku contourne la garde.\r\nL'astuce est de crocheter l'ennemi."
- id: wdr_you_were_able_to
  en: You were able to buy a shrink-wrapped magazine!
  fr: Vous avez achete le magazine sous plastique !
- id: wdr_all_thats_left_to
  en: All that's left to do is to give it to the innocent lad.
  fr: Reste plus qu'a le donner au jeune garcon.
- id: wdr_theres_a_talisman_to
  en: There's a talisman to ward off evil behind this calendar.
  fr: Un talisman protecteur est derriere ce calendrier.
- id: wdr_ca_vient_du_the
  en: Ca vient du the Dragon & Tiger.
  fr: Ca vient du Dragon & Tigre.
- id: wdr_in_blackjack_you_try_2
  en: "In blackjack, you try to get as close as you can to a total\r\nof 21 with the\
    \ cards in your hand."
  fr: "Au blackjack, tentez d'atteindre 21 points avec vos\r\ncartes sans jamais depasser\
    \ ce total."
- id: wdr_if_your_cards_add
  en: "If your cards add up to 22 or more, you automatically lose.\r\nThis is called\
    \ busting."
  fr: "Si votre total depasse 21, vous perdez d'office.\r\nC'est ce qu'on appelle\
    \ sauter."
- id: wdr_the_value_you_see
  en: "The value you see for Total here is the total value of\r\nyour cards."
  fr: La valeur indiquee pour Total est la somme de vos cartes.
- id: wdr_when_your_total_is
  en: "When your total is 11 or less, there is no chance of\r\nbusting, so you should\
    \ always draw another card."
  fr: "A 11 ou moins, aucun risque de sauter.\r\nVous devriez toujours tirer une carte."
- id: wdr_select_hit_to_draw
  en: Select Hit to draw a card.
  fr: Tirez une carte.
- id: wdr_double_down_will_also
  en: "Double Down will also draw a card, but you'll have to play\r\nwith the cards\
    \ in your hand at that point. It will also\r\ndouble your bet."
  fr: "Doubler tire une unique carte tout en doublant votre mise.\r\nVous devez ensuite\
    \ garder cette main sans pouvoir tirer a\r\nnouveau."
- id: wdr_select_hit_or_double
  en: Select Hit or Double Down to draw another card.
  fr: Choisissez Tirer ou Doubler.
- id: wdr_if_youre_worried_that
  en: "If you're worried that drawing another card will take you\r\nover 21, you should\
    \ select Stand."
  fr: Si vous craignez de depasser 21, choisissez Rester.
- id: wdr_its_your_turn_oh
  en: "It's your turn. Oh, you have two Queens. All face cards\r\nhave a value of\
    \ 10."
  fr: "A vous. Vous avez deux Dames. Toutes les tetes valent\r\n10 points."
- id: wdr_when_you_have_two
  en: "When you have two cards of the same value, you can split\r\nyour hand. Go ahead\
    \ and try it now."
  fr: "Avec deux cartes de meme valeur, vous pouvez separer\r\nvotre main. Essayez\
    \ maintenant."
- id: wdr_splitting_allows_you_to
  en: "Splitting allows you to separate your cards into two hands\r\nthat you can\
    \ play simultaneously. The value of the bet\r\nalso doubles."
  fr: "Separer divise vos cartes en deux mains distinctes jouees\r\nen parallele.\
    \ La mise totale est egalement doublee."
- id: wdr_the_results_of_each
  en: "The results of each hand will be reflected in the chip\r\ncount."
  fr: Le resultat de chaque main est calcule separement.
- id: wdr_the_dealers_open_card
  en: "The dealer's open card is an Ace. If the second one is a 10,\r\nJack, Queen,\
    \ or King, he has a blackjack."
  fr: "La carte visible du croupier est un As. S'il a une buche,\r\nil a un blackjack."
- id: wdr_youll_most_likely_lose
  en: "You'll most likely lose if the dealer gets a blackjack, but\r\nyou can lower\
    \ your potential losses by setting half the bet\r\namount as insurance."
  fr: "En cas de blackjack adverse, reduisez vos pertes en misant\r\nla moitie de\
    \ la mise de depart en assurance."
- id: wdr_try_taking_insurance_this
  en: Try taking insurance this time.
  fr: Prenez l'assurance cette fois.
- id: wdr_if_the_insurance_bet
  en: "If the insurance bet wins, you will get back the same amount\r\nas you wagered."
  fr: Si l'assurance gagne, vous recuperez votre mise initiale.
- id: wdr_if_you_take_insurance
  en: "If you take insurance and the dealer ends up not having\r\na blackjack, the\
    \ game will continue."
  fr: Si le croupier n'a pas de blackjack, la manche se poursuit.
- id: wdr_if_you_decide_you
  en: "If you decide you have little or no chance of winning, you\r\ncan select Surrender\
    \ to retire from the game, losing only\r\nhalf the amount you bet."
  fr: "En cas de mauvaise donne, choisissez Abandonner pour\r\nquitter le coup en\
    \ ne perdant que la moitie de la mise."
- id: wdr_if_you_keep_hitting
  en: "If you keep hitting until you have six cards without\r\nbusting, you automatically\
    \ win the game, but keep in mind\r\nthat risk increases with each new card."
  fr: "Tirer 6 cartes sans sauter vous fait gagner d'office.\r\nMais le risque augmente\
    \ a chaque carte !"
- id: wdr_this_concludes_the_tutorial
  en: "This concludes the tutorial. Please enjoy playing all\r\nthe games of skill\
    \ and chance our casino has to offer!"
  fr: "Fin du didacticiel. Profitez bien de tous les jeux de\r\nnotre casino !"
- id: wdr_select_bet_to_set
  en: Select Bet to set the number of chips to wager.
  fr: Choisissez Miser pour fixer les jetons.
- id: wdr_lets_play_the_second
  en: "Let's play the second game. Select Bet or Re-Bet, and then\r\nset the number\
    \ of chips to wager."
  fr: Seconde manche. Choisissez Miser pour placer vos jetons.
- id: wdr_this_is_the_final
  en: "This is the final game in the tutorial. Select Bet or\r\nRe-Bet, and then set\
    \ the number of chips to wager."
  fr: Derniere manche du didacticiel. Choisissez Miser pour jouer.
- id: wdr_ill_teach_you_the_3
  en: "I'll teach you the rules of Pineapple Hold'em, a variant\r\nof Texas Hold'em,\
    \ as we play."
  fr: "Voici les regles du Pineapple Hold'em, variante du\r\nTexas Hold'em, en jouant."
- id: wdr_in_texas_holdem_you
  en: "In Texas Hold'em, you build a five-card hand from two hole\r\ncards (your own\
    \ cards) and five community cards."
  fr: "Au Texas Hold'em, composez 5 cartes avec 2 cartes en main\r\net 5 cartes communes\
    \ sur la table."
- id: wdr_in_pineapple_holdem_you
  en: "In Pineapple Hold'em, you are dealt three cards instead of\r\ntwo, but you\
    \ must discard one of them."
  fr: "Au Pineapple, vous recevez 3 cartes en main et devez en\r\ndefausser une au\
    \ debut."
- id: wdr_lets_see_how_things
  en: Let's see how things develop. Select Check to end your turn.
  fr: Voyons la suite. Choisissez Parole pour passer.
- id: wdr_all_players_have_bet
  en: "All players have bet the same amount, so we'll go on to the\r\nnext round."
  fr: Mises egales, passons au tour suivant.
- id: wdr_community_cards_are_dealt
  en: "Community cards are dealt from the second round. Take a look\r\nat them."
  fr: Les cartes communes arrivent au tour 2. Observez-les bien.
- id: wdr_one_of_your_cards
  en: "One of your cards has the same value as a community card,\r\nmeaning you have\
    \ one pair."
  fr: "Une de vos cartes s'accorde avec le tapis : vous avez une\r\npaire."
- id: wdr_the_player_to_your
  en: "The player to your right has selected Bet and increased\r\nthe wager. He may\
    \ have a good hand."
  fr: Votre voisin relance la mise. Il a sans doute du jeu.
- id: wdr_if_you_think_you
  en: "If you think you have a good hand, select Raise. Or, you\r\ncan select Call\
    \ to bet the same as the previous player.\r\n(Fold is currently disabled.)"
  fr: "Pour relancer, choisissez Relancer. Pour suivre, prenez\r\nSuivre. (Coucher\
    \ est desactive)."
- id: wdr_all_players_have_bet_1
  en: "All players have bet the same amount, so we go on to the\r\nnext round."
  fr: Mises egales, passons au tour suivant.
- id: wdr_this_is_the_third
  en: "This is the third round. Another community card has been\r\ndealt."
  fr: Troisieme tour. Une autre carte commune arrive.
- id: wdr_however_you_still_only
  en: However, you still only have one pair.
  fr: Cependant, vous n'avez qu'une paire.
- id: wdr_at_this_point_you
  en: "At this point, you could select Fold to drop out if you\r\ndidn't like your\
    \ cards."
  fr: Vous pourriez vous coucher si le jeu ne vous plaisait pas.
- id: wdr_but_it_would_be
  en: "But it would be a shame to waste your pair, so let's stay in\r\nthe game.\r\
    \n(Fold is currently disabled.)"
  fr: "Mais gardons cette belle paire, restons dans le coup.\r\n(Coucher est desactive)."
- id: wdr_if_youre_feeling_confident
  en: "If you're feeling confident, select Raise. Or you can select\r\nCall to wager\
    \ the same as the previous player.\r\n(Fold is currently disabled.)"
  fr: "En confiance ? Choisissez Relancer ou Suivre pour miser\r\ncomme les autres.\
    \ (Coucher desactive)."
- id: wdr_this_is_the_final_1
  en: This is the final round. All the cards have been dealt.
  fr: Dernier tour. Toutes les cartes sont sur la table.
- id: wdr_notice_that_you_now
  en: "Notice that you now have another pair. That's a two pair\r\nhand. Let's heat\
    \ things up by selecting Raise."
  fr: 'Vous avez une seconde paire : deux paires ! Relancez !'
- id: wdr_congratulations_you_have_the
  en: "Congratulations! You have the stronger hand, which means\r\nyou win all the\
    \ chips that were bet in this game."
  fr: "Bravo ! Vous avez la meilleure main et remportez tout le\r\npot de la table."
- id: wdr_remember_you_can_bet
  en: "Remember you can Bet or Raise when you think you have\r\na good hand, and Check\
    \ or Call when you want to assess\r\nthe situation. If you'd rather retire, select\
    \ Fold."
  fr: "Misez ou Relancez avec du jeu, Parole ou Suivre pour voir.\r\nPour abandonner,\
    \ choisissez Coucher."
- id: wdr_this_concludes_the_practice
  en: "This concludes the practice game. Please enjoy playing\r\nall the games of\
    \ skill and chance our casino has to offer!"
  fr: Fin de l'entrainement. Profitez des jeux de notre casino !
- id: wdr_put_simply_baccarat_is
  en: "Put simply, baccarat is a game in which you bet on whether\r\nthe player or\
    \ the banker will win by getting the closest\r\nto a score of 9."
  fr: "Au baccarat, pariez sur la victoire du joueur ou de la\r\nbanque pour approcher\
    \ 9 points."
- id: wdr_there_are_six_spots
  en: "There are six spots on which you can bet. For now, try\r\nbetting on either\
    \ the banker or the player."
  fr: Il y a 6 zones de paris. Pariez sur joueur ou banque.
- id: wdr_bet_on_the_banker
  en: Bet on the banker or the player.
  fr: Pariez sur joueur ou banque.
- id: wdr_refer_to_the_bet
  en: "Refer to the bet limit to see how many chips you can bet.\r\nUse the Ã\x97\
    \ button to change your bet."
  fr: Voyez la limite de mise. Utilisez la touche pour changer.
- id: wdr_use_the_right_stick
  en: "Use the right stick to squeeze the second card of the side\r\nyou bet on. Go\
    \ ahead."
  fr: Inclinez le stick droit pour decouvrir la seconde carte.
- id: wdr_if_either_the_player
  en: "If either the player or the banker has an 8 or 9\r\n(a natural), the winner\
    \ is decided at that point."
  fr: Un 8 ou 9 d'entree (naturel) donne la victoire immediate.
- id: wdr_a_winning_bet_on
  en: "A winning bet on the player pays 1:1, while a winning bet on\r\nthe banker\
    \ pays 0.95:1."
  fr: 'Pari gagnant sur joueur : 1:1. Sur banque : 0,95:1.'
- id: wdr_you_can_also_bet
  en: "You can also bet that the player and banker will tie, and if\r\nyou're right,\
    \ the payout will be 8:1."
  fr: Parier sur une egalite rapporte 8 contre 1.
- id: wdr_now_try_betting_on
  en: "Now, try betting on a pair. This means you think that the\r\nface value of\
    \ the first cards dealt will be the same."
  fr: "Parier sur une paire signifie que les 2 cartes auront la\r\nmeme valeur."
- id: wdr_select_who_you_think
  en: "Select who you think will get a pair--the player or the\r\nbanker."
  fr: Choisissez qui obtiendra une paire (joueur ou banque).
- id: wdr_when_you_bet_on
  en: "When you bet on a player pair, you're guessing that the\r\nfirst two cards\
    \ dealt to the player will have the same\r\nface value."
  fr: "Paire joueur : les 2 premieres cartes du joueur ont le\r\nmeme rang."
- id: wdr_when_you_bet_on_1
  en: "When you bet on a banker pair, you're guessing that the\r\nfirst two cards\
    \ dealt to the banker will have the same\r\nface value."
  fr: "Paire banque : les 2 premieres cartes de la banque ont le\r\nmeme rang."
- id: wdr_bet_on_who_you
  en: Bet on who you think will get a pair.
  fr: Pariez sur qui obtiendra une paire.
- id: wdr_when_you_bet_on_2
  en: "When you bet on a pair, the game is decided as soon as\r\nthe first two cards\
    \ of each side are opened."
  fr: Le pari paire est tranche des l'ouverture des cartes.
- id: wdr_last_but_not_least
  en: "Last but not least, I'll explain how to bet on Super 6.\r\nThe best way to\
    \ learn is by practice, so try betting on\r\nSuper 6 now."
  fr: Voici le Super 6. Essayez de parier dessus maintenant.
- id: wdr_super_6_refers_to
  en: "Super 6 refers to the banker beating the player with a 6.\r\nA winning bet\
    \ pays up to 12:1."
  fr: "Super 6 : la banque bat le joueur avec un score de 6.\r\nRapporte 12 contre\
    \ 1 !"
- id: wdr_the_payout_is_only
  en: "The payout is only 0.5:1 if you simply bet on the banker\r\nwinning when a\
    \ Super 6 results."
  fr: Payer sur la banque simple en cas de 6 ne paie que 0,5:1.
- id: wdr_ill_teach_you_the_4
