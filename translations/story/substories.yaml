  fr: Hola l'ami. Tu ne tricherais pas, par hasard ?
- id: wdr_fantasy_zones_100_do
  en: Fantasy Zone's \100. Do I want to play?
  fr: Fantasy Zone est a 100 yens. On joue ?
- id: wdr_out_run_is_100
  en: Out Run is \100. Do I want to play?
