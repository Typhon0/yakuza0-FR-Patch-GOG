  en: Acquire %d different weapons
  fr: Obtenir %d armes différentes
- id: stay_adventure
  en: Adventure
  fr: Aventure
- id: stay_adventurer
  en: Adventurer
  fr: Aventurier
- id: stay_advisor
  en: Advisor
  fr: Conseiller
- id: stay_africa
  en: Africa
  fr: Afrique
- id: stay_ais_accessory_collection_1
  en: Ai's accessory collection 1
  fr: Collection d'accessoires d'Ai 1
- id: stay_ais_accessory_collection_2
  en: Ai's accessory collection 2
  fr: Collection d'accessoires d'Ai 2
- id: stay_ais_accessory_collection_3
  en: Ai's accessory collection 3
  fr: Collection d'accessoires d'Ai 3
- id: stay_an_asian_crime_syndicate
  en: |-
    An Asian crime syndicate. The
    organization has a wide reach and
    can easily source weapons and gear,
    but some members are less reliable
    and may keep goods for themselves.
  fr: |-
    Syndicat du crime asiatique tentaculaire. Leurs filières d'approvisionnement
    sont quasi illimitées. Transport par container scellé.
- id: stay_an_english_soccer_stadium
  en: |-
    An English soccer stadium and a
    battlefield for overzealous fans.
  fr: |-
    Un stade de football anglais, arène de combat
    pour supporters hooligans survoltés.
- id: stay_an_indian_nobleman_who
  en: |-
    An Indian nobleman who lost big on
    gambling is now selling his ancient
    family heirlooms to make ends meet.
  fr: |-
    Un noble indien ruiné par le jeu qui brade les précieux
    héritages familiaux pour joindre les deux bouts.
- id: stay_an_antigovernment_activist_who
  en: |-
    An anti-government activist who has
    traveled far and wide, making
    countless connections across many
    countries. Carries a large suitcase,
    but there's no telling what's
    already inside.
