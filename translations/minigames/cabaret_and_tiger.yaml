# Yakuza 0 GOG - Cabaret Club Hostesses & Dragon and Tiger Agents Catalog

domain: minigames
total_entries: 874
entries:
- id: stay_famous_big_cities_and
  en: |-
    "Famous big cities and tourist
    destinations with mafia families
    pulling strings from the shadows.
  fr: |-
    "Grandes métropoles célèbres et destinations
    touristiques où des familles mafieuses tirent
    les ficelles dans l'ombre.
- id: stay_kak_dela
  en: '"Kak Dela"'
  fr: « Kak Dela »
- id: stay_the_jackal
  en: '"The Jackal"'
  fr: « Le Chacal »
- id: stay_5jc
  en: 5JC
  fr: 5JC
- id: stay_a_central_american_criminal
  en: |-
    A Central American criminal group
    known for ruthless robberies and
    excessively vicious blackmail.
  fr: |-
    Un cartel d'Amérique centrale réputé pour ses braquages
    impitoyables et ses chantages d'une rare violence.
- id: stay_a_eastern_european_weapon
  en: |-
    A Eastern European weapon smuggler.
    Used to deal in antique weapons and
    armors, but the business was too
    slow. Carries around a great number
    of items, passing himself as a
    traveling antique salesman.
  fr: |-
    Contrebandier d'Europe de l'Est. Écoulait jadis des antiquités
    avant de passer aux armes lourdes. Utilise une vieille malle.
- id: stay_a_middle_eastern_prince
  en: |-
    A Middle Eastern prince, 50th in
    line to the throne. In order to
    actually live like a prince, he had
    to take up some sort of work and
    decided to be an arms agent. Travels
    with a king-sized suitcase.
  fr: |-
    Prince du Moyen-Orient, 50e dans l'ordre de succession. Pour financer
    son train de vie, revend des armes rares. Malle princière.
- id: stay_a_moscow_bar_popular
  en: |-
    A Moscow bar popular among army
    officers. The name is Russian
    for "How's it going?"
  fr: |-
    Un bar moscovite couru des officiers de l'armée.
    Son nom signifie « Comment ça va ? » en russe.
- id: stay_a_native_american_village
  en: |-
    A Native American village that
    retains traditional methods of
    making spears and crafts.
  fr: |-
    Un village amérindien conservant les méthodes ancestrales
    de fabrication de lances et d'artisanat.
- id: stay_a_siberian_general_store
  en: |-
    A Siberian general store selling
    deadly weapons to the drunk, rowdy
    clientele.
  fr: |-
    Bazar sibérien refourguant des armes mortelles
    à une clientèle ivre et turbulente.
- id: stay_a_south_american_shaman
  en: |-
    A South American shaman guided in
    her weapon searches by the spirits.
    Opinions are divided on how
    effective that is. Physically frail,
    she can only carry a small bag.
  fr: |-
    Chamane sud-américaine guidée dans ses recherches par
    les esprits ancestraux. Trouve des matériaux mystiques.
    Voyage avec un sac artisanal tissé.
- id: stay_a_beautiful_dancer_in
  en: |-
    A beautiful dancer in an attention-
    grabbing costume. Having grown up in
    the slums, she has many friends in
    the South American criminal
    underworld. Her travel bag is much
    larger than you'd expect.
  fr: |-
    Danseuse magnifique au costume étincelant. Son charme
    sensoriel désarme les vendeurs les plus coriaces.
    Voyage avec une malle de spectacle colorée.
- id: stay_a_big_shot_in
  en: |-
    A big shot in the Latin American
    underworld. Though he normally pulls
    strings from the shadows, as an
    exception he'll work for you
    directly. Likes sushi. An underling
    carries a large travel bag for him.
  fr: |-
    Un ponte de la pègre latino-américaine. Bien qu'il vende
    cher, ses filières sont d'une fiabilité absolue.
    Voyage avec une valise blindée.
- id: stay_a_college_student_in
  en: |-
    A college student in a
    science field, her smarts
    are her charm point.
  fr: |-
    Étudiante en filière scientifique,
    son intelligence fait tout son
    charme.
- id: stay_a_continent_with_a
  en: |-
    A continent with a rich natural
    environment. Some areas suffer
    from internal conflicts.
  fr: |-
    A continent with a rich natural
    environment. Some areas suffer
    from internal conflicts.
- id: stay_a_continent_with_lush
  en: |-
    A continent with lush natural
    environments. Some areas suffer
    from instability and crime.
  fr: |-
    A continent with lush natural
    environments. Some areas suffer
    from instability and crime.
- id: stay_a_criminal_group_heavily
  en: |-
    A criminal group heavily involved in
    assassinations. They also trade in
    decorative items for trendy killers.
  fr: |-
    Réseau criminel spécialisé dans les contrats d'assassinat,
    trafiquant aussi des parures pour tueurs stylés.
- id: stay_a_cunning_spy_who
  en: |-
    A cunning spy who puts her charisma
    to a good use. Her travel bag is
    a standard size.
  fr: |-
    Une espionne rusée qui met son charisme au service
    de ses missions. Sa valise de marque ne passe pas
    visuellement inaperçue.
- id: stay_a_denselypopulated_slum_that
  en: |-
    A densely-populated slum that has
    grown and expanded to resemble a
    castle, where money is king.
  fr: |-
    Un bidonville tentaculaire devenu une véritable forteresse
    urbaine où seul l'argent fait la loi.
- id: stay_a_famous_adventurer_who
  en: |-
    A famous adventurer who knows any
    country in the world like the back
    of his hand. With great negotiation
    skills, travel expertise, and an
    enormous suitcase, he's the guy to
    send out when you need equipment.
  fr: |-
    Aventurier réputé connaissant le monde comme sa
    poche. S'enfonce dans les recoins les plus hostiles.
    Équipé d'un sac à dos d'exploration.
- id: stay_a_girl_with_a
  en: |-
    A girl with a laid-back
    personality, she went to
    the same school as Yuki.
  fr: |-
    Une jeune fille décontractée,
    qui allait dans la même école
    que Yuki.
- id: stay_a_girl_with_lots
  en: |-
    A girl with lots of
    potential, she is great
    at romantic talk.
  fr: |-
    Une fille à grand potentiel,
    très douée pour les
    conversations romantiques.
- id: stay_a_girl_with_maturity
  en: |-
    A girl with maturity,
    her skills make older
    men swoon.
  fr: |-
    Une hôtesse mature dont le
    savoir-faire fait chavirer
    les hommes d'âge mûr.
- id: stay_a_globetrotting_street_performer
  en: |-
    A globetrotting street performer.
    Doesn't know much about weaponry,
    but has a good eye for finding
    parts. Carries a spacious travel
    bag.
  fr: |-
    Un artiste de rue globe-trotteur. S'y connaît
    peu en armes, mais a l'oeil pour trouver des
    pièces rares. Porte un grand sac de voyage.
- id: stay_a_greatly_feared_pirate
  en: |-
    A greatly feared pirate operating in
    the waters off Africa's eastern
    coastline. Plunders only top-quality
    goods shipments. Has access to many
    excellent smuggling routes.
  fr: |-
    Capitaine pirate redouté des côtes somaliennes. Arraisonne les cargos d'armes
    pour revendre leur cargaison. Coffre marin cerclé de fer.
- id: stay_a_group_known_for
  en: |-
    A group known for its cruelty and a
    particular fondness for knives and
    brass knuckles.
  fr: |-
    Un groupe connu pour sa cruauté et son goût très prononcé
    pour les couteaux et les poings américains.
- id: stay_a_highranking_official_who
  en: |-
    A high-ranking official who deals in
    weapons and gear to fund his
    political activities. He has a lot
    of pull in important places and can
    get you top-grade stuff. Carries a
    large, expensive-looking suitcase.
  fr: |-
    Haut fonctionnaire corrompu revendant des prototypes militaires secrets
    pour garnir ses comptes suisses. Attaché-case officiel.
- id: stay_a_homeless_man_based
  en: |-
    A homeless man based in the
    Sotenbori area. He and his buddies
    have their own intelligence-
    gathering network. His bag isn't
    particularly large, though.
  fr: |-
    Un sans-abri basé à Sotenbori. Ses compères et lui
    parcourent le Japon à la recherche d'équipements.
    Utilise un grand sac à dos usé.
- id: stay_a_huge_area_with
  en: |-
    A huge area with locations from
    India to the desert. The
    negotiations here are varied.
  fr: |-
    Une immense région allant de l'Inde
    jusqu'aux déserts. Les négociations
    y sont particulièrement variées.
- id: stay_a_huge_military_research
  en: |-
    A huge military research facility
    in the middle of the desert. No one
    knows what they're doing there.
  fr: |-
    Une immense base militaire au milieu du désert.
    Personne ne sait ce qui s'y trame réellement.
- id: stay_a_karate_dojo_the
  en: |-
    A karate dojo. The master may be
    persuaded to part with his precious
    tonfa and nunchaku, for a price.
  fr: |-
    Un dojo de karaté. Le maître pourrait céder
    ses précieux tonfas et nunchakus, moyennant finances.
- id: stay_a_karate_master_from
  en: |-
    A karate master from Okinawa. Easy-
    going and booze-loving. Knows where
    to get high quality weapons quickly.
  fr: |-
    Un maître de karaté d'Okinawa. Bon vivant et amateur d'alcool.
    Sait où trouver rapidement des armes de haute volée.
- id: stay_a_large_yakuza_group
  en: |-
    A large yakuza group based in the
    Kansai area. Not at war with any
    other families... for now.
  fr: |-
    Un puissant clan yakuza basé dans le Kansai.
    En paix avec les autres familles... pour le moment.
- id: stay_a_lively_market_with
  en: |-
    A lively market with some stalls
    selling all kinds of illegal goods.
  fr: |-
    Un marché animé dont plusieurs échoppes vendent toutes
    sortes de marchandises illicites sous le manteau.
- id: stay_a_longforgotten_shrine_deep
  en: |-
    A long-forgotten shrine deep in
    a black forest, where even the
    bravest locals fear to tread.
  fr: |-
    Un sanctuaire oublié au coeur d'une forêt noire,
    où même les locaux les plus braves craignent d'aller.
- id: stay_a_market_in_a
  en: |-
    A market in a South American city--
    the place to go to for weapons and
    gear not available via legal means.
  fr: |-
    Un marché sud-américain : le lieu idéal pour dégoter
    des armes et pièces introuvables par voies légales.
- id: stay_a_market_open_only
  en: |-
    A market open only at night,
    where the stalls are lined with
    weaponry from sundown to sunrise.
  fr: |-
    Un marché nocturne dont les étals regorgent d'armes
    du coucher au lever du soleil.
- id: stay_a_mature_lady_from
  en: |-
    A mature lady from Osaka,
    she loves to gossip and
    will talk up a storm!
  fr: |-
    Une dame d'âge mûr d'Osaka.
    Elle adore les potins et parle
    comme une vraie mitraillette !
- id: stay_a_mercenary_who_makes
  en: |-
    A mercenary who makes a living in
    various internal conflict zones in
    Africa. Given his day job, he is
    adept at sourcing weapons and gear.
    His bag is quite large.
  fr: |-
    Mercenaire vétéran monnayant ses talents dans les guerres civiles africaines.
    Récupère les meilleures armes de guerre. Sac militaire d'assaut.
- id: stay_a_mysterious_girl_who
  en: |-
    A mysterious girl who
    demands to go by Marilyn.
    Her real name is Mariko.
  fr: |-
    Une fille mystérieuse qui exige
    qu'on l'appelle Marilyn.
    Son vrai nom est Mariko.
- id: stay_a_pilot_who_flies
  en: |-
    A pilot who flies international
    routes. Deals in weapons on the side
    to earn foreign currency and help
    his poverty-stricken homeland. Has
    lots of space in his suitcase.
  fr: |-
    Pilote sur les lignes internationales. Transporte des
    armes entre les continents en évitant les contrôles.
    Utilise sa valise de pilote de ligne.
- id: stay_a_political_thinker_and
  en: |-
    A political thinker and ideologue
    working as an agent to fund his
    activities, he is surprisingly
    effective at finding good weapons
    and gear. Has a large suitcase.
  fr: |-
    Penseur politique et idéologue finançant son mouvement par le trafic
    d'équipements de combat. Voyage avec un sac en toile sobre.
- id: stay_a_powerful_criminal_organization
  en: |-
    A powerful criminal organization.
    Get on their bad side and you
    could wind up dead... or worse.
  fr: |-
    Une puissante triade criminelle. S'attirer leurs foudres
    peut vous coûter la vie... ou pire encore.
- id: stay_a_professional_swindler_who
  en: |-
    A professional swindler who makes
    full use of her personal charm in
    negotiations. Her travel bag is a
    regular size, but she hates to carry
    heavy weapons and prefers to focus
    on parts instead.
  fr: |-
    Une arnaqueuse professionnelle qui use de tout
    son charme pour dégoter des armes rares. Voyage
    avec une petite valise chic.
- id: stay_a_quiz_show_presenter
  en: |-
    A quiz show presenter who travels
    all over Japan and abroad. Can
    easily transport various goods by
    passing them as quiz show prizes.
    Doesn't have too much spare space in
    his suitcase.
  fr: |-
    Présentateur de jeu télévisé parcourant le Japon
    et l'étranger. Se sert de ses tournages pour dégoter
    des armes. Porte une valise de luxe.
- id: stay_a_retired_marine_who
  en: |-
    A retired marine who finds civilian
    life just too boring. He started
    working as an agent, making use of
    old connections in the military and
    transport routes open only to those
    in the know.
  fr: |-
    Un marine à la retraite trouvant la vie civile bien
    trop fade. Cherche l'adrénaline en quête d'armes.
    Utilise son ancien paquetage militaire.
- id: stay_a_roadside_marketplace_you
  en: |-
    A roadside marketplace. You never
    know what you might find there.
  fr: |-
    Un marché le long de la route. On ne sait jamais
    sur quel trésor insolite on peut tomber.
- id: stay_a_rundown_dive_bar
  en: |-
    A run-down dive bar by a highway.
    They sell more shotguns than shots.
  fr: |-
    Un bar miteux au bord d'une autoroute.
    On y vend plus de fusils que de verres d'alcool.
- id: stay_a_shorthaired_girl_with
  en: |-
    A short-haired girl with
    a sunny personality, she
    likes strange talk.
  fr: |-
    Une fille aux cheveux courts et
    souriante, qui a un goût pour
    les sujets insolites.
- id: stay_a_small_settlement_of
  en: |-
    A small settlement of the Inuit
    people who make a living hunting.
  fr: Un petit campement inuit vivant principalement de la chasse.
- id: stay_a_small_village_in
  en: |-
    A small village in the cold north,
    where it's possible to purchase
    equipment and weapons for hunting.
  fr: |-
    Un petit village du grand nord où l'on peut
    acheter de l'équipement et des armes de chasse.
- id: stay_a_smoothtalking_swindler_who
  en: |-
    A smooth-talking swindler who gets
    the best from any deal. Can be very
    useful, but may not be entirely
    trustworthy. Likes to travel light,
    with a small and compact suitcase.
  fr: |-
    Un escroc à la langue bien pendue qui tire le
    meilleur de chaque affaire. Transporte ses trouvailles
    dans un sac en cuir.
- id: stay_a_soldier_who_has
  en: |-
    A soldier who has seen many a
    battlefield across the world. It's
    not clear whether his unique combat
    methods have much practical value.
    Carries a sizeable travel suitcase.
  fr: |-
    Un soldat aguerri qui a écumé les champs de bataille
    du monde entier. Déniche le matériel le plus létal.
    Voyage avec un paquetage de survie.
- id: stay_a_student_from_korea
  en: |-
    A student from Korea, her
    fluent Japanese is one of
    her charms.
  fr: |-
    Étudiante coréenne, son japonais
    impeccable fait partie de ses
    nombreux charmes.
- id: stay_a_suburban_sushi_bar
  en: |-
    A suburban sushi bar owned by a
    Japanophile who deals in many
    imported Japanese items.
  fr: |-
    Un bar à sushis de banlieue tenu par un nippophile
    écoulant de nombreux produits japonais importés.
- id: stay_a_terrifying_criminal_organization
  en: |-
    A terrifying criminal organization
    known for large-scale robberies
    and mass extortions.
  fr: |-
    Une terrifiante organisation criminelle connue pour ses
    braquages d'envergure et ses extorsions massives.
- id: stay_a_total_mess_negotiations
  en: |-
    A total mess!
    Negotiations break down in chaos.
  fr: |-
    Fiasco total !
    Les négociations tournent au vinaigre.
- id: stay_a_tough_girl_with
  en: |-
    A tough girl with a
    great work ethic, she
    has a bright personality.
  fr: |-
    Une fille déterminée et dévouée,
    à la personnalité lumineuse
    et entraînante.
- id: stay_a_trap_target_materials
  en: |-
    A trap!
    Target materials have been stolen.
  fr: |-
    Un piège !
    Les matériaux ciblés ont été volés.
- id: stay_a_very_old_mafia
  en: |-
    A very old mafia family based
    in a picturesque seaside town.
  fr: |-
    Une très ancienne famille mafieuse établie dans une
    pittoresque bourgade côtière.
- id: stay_a_veteran_with_refined
  en: |-
    A veteran with refined
    skills who used to work at
    a high-end club.
  fr: |-
    Une vétérane au savoir-faire
    éprouvé ayant exercé dans un
    club huppé.
- id: stay_a_vibrant_chaotic_region
  en: |-
    A vibrant, chaotic region. Has
    a massive market, but is also full
    of counterfeit goods.
  fr: |-
    Une région vibrante et chaotique.
    Possède un marché géant, mais aussi
    son lot de contrefaçons.
- id: stay_a_village_renowned_for
  en: |-
    A village renowned for its weapon
    craftsmen, whose skills have been
    passed on for many generations.
  fr: |-
    Un village réputé pour ses maîtres forgerons,
    dont le savoir-faire se transmet depuis des générations.
- id: stay_a_weapon_craftsman_whos
  en: |-
    A weapon craftsman who's much
    happier in his workshop, but is
    sometimes forced by his wife to take
    on assignments as a weapons agent.
    Uses a large travel bag.
  fr: |-
    Artisan d'armes bien plus heureux dans son
    atelier, mais parfois forcé par sa femme de faire
    des missions d'agent. Voyage avec un grand sac.
- id: stay_a_worldclass_spy_who
  en: |-
    A world-class spy who supplements
    his income procuring weapons for
    anyone who's willing to pay. He
    won't let you down. The only
    drawback is that his travel bag
    isn't that big.
  fr: |-
    Un espion de classe mondiale qui arrondit ses fins
    de mois en fournissant des armes. Voyage léger avec
    un sac de créateur discret.
- id: stay_a_wrestler_with_a
  en: |-
    A wrestler with a huge following in
    the US. Works as an agent to save up
    for medical treatment for a
    seriously ill friend who helped him
    out in the past. His travel suitcase
    can hold a lot of items.
  fr: |-
    Catcheur adulé aux États-Unis. Travaille comme agent
    pour se payer des extras. Sa carrure intimide les vendeurs.
    Utilise un sac polochon géant.
- id: stay_a_youth_from_a
  en: |-
    A youth from a jungle-dwelling
    tribe. Deals in weapons and parts to
    earn some cash. Doesn't own a
    suitcase, so he can only bring as
    much as he can carry in his hands.
  fr: |-
    Jeune chasseur d'une tribu de la jungle. Excelle à dénicher des matériaux
    et poisons rares dans la canopée. Carquois et besace en peau.
- id: stay_acquire_d_different_accessories
  en: Acquire %d different accessories for Ai
  fr: Obtenir %d accessoires différents pour Ai
- id: stay_acquire_d_different_accessories_1
  en: Acquire %d different accessories for Chika
  fr: Obtenir %d accessoires différents pour Chika
- id: stay_acquire_d_different_accessories_2
  en: Acquire %d different accessories for Hibiki
  fr: Obtenir %d accessoires différents pour Hibiki
- id: stay_acquire_d_different_accessories_3
  en: Acquire %d different accessories for Mana
  fr: Obtenir %d accessoires différents pour Mana
- id: stay_acquire_d_different_accessories_4
  en: Acquire %d different accessories for Saki
  fr: Obtenir %d accessoires différents pour Saki
- id: stay_acquire_d_different_accessories_5
  en: Acquire %d different accessories for Yuki
  fr: Obtenir %d accessoires différents pour Yuki
- id: stay_acquire_d_different_gear
  en: Acquire %d different gear items
  fr: Obtenir %d pièces d'équipement différentes
- id: stay_acquire_d_different_gear_1
  en: Acquire %d different gear or accessory items
  fr: Obtenir %d pièces d'équipement ou accessoires différents
- id: stay_acquire_d_different_prizes
  en: Acquire %d different prizes
  fr: Obtenir %d prix différents
- id: stay_acquire_d_different_prizes_1
  en: Acquire %d different prizes from the UFO Catcher
  fr: Obtenir %d prix différents au UFO Catcher
