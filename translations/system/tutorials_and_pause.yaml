  fr: Pressez <Sign:32> pour style Beast.
- id: sys_press_sign1_near_an
  en: |-
    Press <Sign:1> near an enemy on the
    ground.
  fr: |-
    Pressez <Sign:1> près d'un ennemi au
    sol.
- id: sys_press_sign31_to_switch_1
  en: Press <Sign:31> to switch to Breaker style.
  fr: Pressez <Sign:31> pour style Danseur.
- id: sys_press_sign32_to_switch_1
  en: Press <Sign:32> to switch to Slugger style.
  fr: Pressez <Sign:32> pour style Batteur.
- id: sys_press_sign1_during_a
  en: Press <Sign:1> during a <Sign:2> Rush Combo.
  fr: Pressez <Sign:1> durant un combo <Sign:2>.
- id: sys_the_game_ends_when
  en: |-
    The game ends when you lose
    all your health.
  fr: |-
    La partie prend fin si votre santé
    est vide.
- id: sys_evade_the_customers_attacks
  en: 'Evade the customer''s attacks using <Sign:3>.

    '
  fr: 'Esquivez les coups du client avec <Sign:3>.

    '
- id: sys_use_sign3_to_perform
  en: |-
    Use <Sign:3> to perform a string of
    Quicksteps.
  fr: |-
    Utilisez <Sign:3> pour enchaîner les
    esquives.
- id: sys_you_can_switch_to
  en: You can switch to Rush style by pressing <Sign:31>
  fr: 'Passez en style Rush en pressant <Sign:31>    '
- id: sys_hold_down_sign2_or
  en: |-
    Hold down <Sign:2> or <Sign:1> after being
    attacked.
  fr: |-
    Maintenez <Sign:2> ou <Sign:1> après une
    attaque.
- id: sys_press_sign1_in_front
  en: |-
    Press <Sign:1> in front of an enemy
    wielding a sword.
  fr: |-
    Pressez <Sign:1> face à un ennemi armé
    d'un katana.
- id: sys_use_breaker_style_to
  en: Use Breaker style to finish off the enemy with flair.
  fr: 'Style Danseur pour achever l''ennemi avec classe.  '
- id: sys_use_slugger_style_to
  en: |-
    Use Slugger style to defeat Fei Hu and
    pass the test.
  fr: |-
    Battez Fei Hu avec le style Batteur pour
    réussir.
- id: sys_hold_sign6_to_guard_2
  en: |-
    Hold <Sign:6> to guard with the Heat Gauge at
    1st bar.
  fr: |-
    Gardez avec <Sign:6> avec 1 barre de Furia
    pleine.
- id: sys_tap_sign1_repeatedly_while
  en: |-
    Tap <Sign:1> repeatedly while attacking
    with <Sign:2>.
  fr: |-
    Appuyez sur <Sign:1> en attaquant avec
    <Sign:2>.
- id: sys_use_beast_style_moves
  en: |-
    Use Beast style moves to pulverize the pack of
    cowards.
  fr: 'Pulvérisez cette bande de lâches en style

    Beast.  '
- id: sys_press_sign1_in_front_1
  en: |-
    Press <Sign:1> in front of an enemy
    with their guard up.
  fr: |-
    Pressez <Sign:1> face à un ennemi qui
    se protège.
- id: sys_press_sign2_sign2_sign2
  en: Press <Sign:2>, <Sign:2>, <Sign:2>, <Sign:1>, then <Sign:1>.
  fr: Tapez <Sign:2>, <Sign:2>, <Sign:2>, <Sign:1>, puis <Sign:1>.
- id: sys_press_sign1_without_sign4
  en: |-
    Press <Sign:1> without <Sign:4> stance
    when an enemy attacks.
  fr: |-
    Pressez <Sign:1> sans garde <Sign:4>
    quand l'ennemi attaque.
- id: sys_press_sign1_while_an
  en: |-
    Press <Sign:1> while an enemy attacks
    with a one-handed blade.
  fr: |-
    Pressez <Sign:1> quand l'ennemi attaque
    avec une lame.
- id: sys_press_sign2_or_sign1
  en: |-
    Press <Sign:2> or <Sign:1> after being
    attacked while in Heat Mode.
  fr: 'Pressez <Sign:2> ou <Sign:1> après un coup

    reçu en mode Furia.    '
- id: sys_press_sign1_in_front_2
  en: |-
    Press <Sign:1> in front of an enemy with a sword
    while in Heat Mode.
  fr: |-
    Pressez <Sign:1> face à une épée en
    étant en mode Furia.
- id: sys_use_sign2_near_a
  en: |-
    Use <Sign:2> near a <Sign:23> mark to perform
    an auto weapon attack.
  fr: |-
    Pressez <Sign:2> près d'un signe <Sign:23>
    pour frapper avec l'arme.
- id: sys_hitting_enemies_using_sign2
  en: |-
    Hitting enemies using <Sign:2> or <Sign:1> will
    eventually stun them.
  fr: 'Frapper avec <Sign:2> ou <Sign:1> finira

    par étourdir l''ennemi. '
- id: sys_shatter_the_arm_of
  en: |-
    Shatter the arm of an enemy wielding a one-handed
    blade. Show no mercy!
  fr: |-
    Brisez le bras de l'ennemi arme d'une lame a une
    main. Sans pitie !
- id: sys_press_sign1_while_running_1
  en: |-
    Press <Sign:1> while running to perform a
    Dash Pirouette running attack.
  fr: |-
    Pressez <Sign:1> en courant pour lancer
    une pirouette d'élan.
- id: sys_your_training_is_now
  en: |-
    Your training is now complete.

    Attack Komeki with everything you've got.
  fr: |-
    Entraînement terminé.

    Attaquez Komeki de toutes vos forces.
- id: sys_press_sign0_while_evading
  en: |-
    Press <Sign:0> while evading with <Sign:3>
    when the Heat Gauge is at 2nd bar.
  fr: |-
    Pressez <Sign:0> en esquivant avec <Sign:3>
    avec 2 barres de Furia.
- id: sys_this_reckless_attack_is
  en: |-
    This reckless attack is executed after
    performing a backhanded Finishing Blow.
  fr: |-
    Cette attaque brutale s'exécute après un
    puissant coup de grâce du revers.
- id: sys_switch_to_breaker_style_1
  en: |-
    Switch to Breaker style!

    You can switch to Breaker style by pressing <Sign:31>
  fr: 'Passez en style Danseur !


    Vous pouvez l''activer en pressant <Sign:31>        '
- id: sys_use_sign0_to_grab
  en: |-
    Use <Sign:0> to grab an enemy, then
    attack with <Sign:2>, <Sign:1>, or <Sign:0>.
  fr: |-
    Saisissez l'ennemi (<Sign:0>), puis
    attaquez via <Sign:2>, <Sign:1> ou <Sign:0>.
- id: sys_with_the_heat_gauge
  en: |-
    With the Heat Gauge at 3rd, press <Sign:1>
    when enemy attacks or when behind them.
  fr: |-
    À la 3e barre, pressez <Sign:1> si l'ennemi
    attaque ou dans son dos.
- id: sys_press_sign1_in_front_3
  en: |-
    Press <Sign:1> in front of the attacking
    customer with the Heat Gauge at the 3rd bar.
  fr: |-
    Pressez <Sign:1> face au client hostile
    avec la jauge Furia au niveau 3.
- id: sys_use_sign4_and_sign45
  en: |-
    Use <Sign:4> and <Sign:45> to lock onto an enemy,
    which helps when fighting single foes.
  fr: |-
    Verrouillez l'ennemi avec <Sign:4> et
    <Sign:45>, utile en combat singulier.
- id: sys_when_hit_press_sign2
  en: |-
    When hit, press <Sign:2>, <Sign:1>, or <Sign:0> to
    counter (unless you're knocked down).
  fr: |-
    Si touché, ripostez vite avec <Sign:2>,
    <Sign:1> ou <Sign:0> (sauf au sol).
- id: sys_enter_sign4_stance_with
  en: |-
    Enter <Sign:4> stance with Heat Gauge at 3rd bar,
    and press <Sign:0> when an enemy attacks.
  fr: |-
    En garde <Sign:4> avec 3 barres de Furia,
    pressez <Sign:0> quand l'ennemi attaque.
- id: sys_defeat_the_hitman_targeting
  en: |-
    Defeat the hitman targeting Bacchus!

    Use your Brawler style moves to take out
    the assassin.
  fr: 'Éliminez le tueur ciblant Bacchus !


    Utilisez le style Bagarreur pour battre

    l''assassin.    '
- id: sys_press_sign0_with_heat
  en: |-
    Press <Sign:0> with Heat Gauge at 2nd or 3rd bar
    to grab enemies or objects, then press <Sign:1>.
  fr: |-
    Pressez <Sign:0> avec 2 ou 3 barres pour
    saisir un ennemi, puis pressez <Sign:1>.
- id: sys_press_sign2_repeatedly_to
  en: |-
    Press <Sign:2> repeatedly to perform a Rush Combo.

    This is the most basic method of attack in battle.
  fr: |-
    Enchaînez <Sign:2> pour un combo d'attaque.

    C'est la base de tout combat à mains nues.
- id: sys_you_can_charge_up
  en: |-
    You can charge up a counterattack. The attack
    is more powerful, and likely to knock the
    opponent down.
  fr: |-
    Vous pouvez charger une riposte.
    L'attaque est plus forte et renverse
    souvent l'adversaire.
- id: sys_switch_to_beast_style_1
  en: |-
    Switch to Beast style!

    You can switch to Beast style by pressing <Sign:32>
    Try changing to Beast style now.
  fr: |-
    Passez en style Beast !

    Activez-le en pressant <Sign:32>.
    Essayez de changer de style maintenant.
- id: sys_slip_past_a_guarding
  en: |-
    Slip past a guarding enemy's arms, grab their face,
    twist them to the ground, then stomp them to finish
    the job.
  fr: 'Passez la garde ennemie, saisissez sa tête,

    plaquez-le au sol et piétinez-le pour

    l''achever.  '
- id: sys_switch_to_slugger_style_1
  en: |-
    Switch to Slugger style!

    You can switch to Slugger style by pressing <Sign:32>
    Try changing to Slugger style now.
  fr: |-
    Passez en style Batteur !

    Activez-le en pressant <Sign:32>.
    Essayez de changer de style maintenant.
- id: sys_while_evading_with_sign3
  en: |-
    While evading with <Sign:3> when the Heat Gauge
    is at 2nd bar, press <Sign:0> to coil around an enemy
    and attack them.
  fr: 'En esquivant avec <Sign:3> et 2 barres de Furia,

    pressez <Sign:0> pour ceinturer l''ennemi et

    l''attaquer.             '
- id: sys_when_caught_between_two
  en: |-
    When caught between two enemies, press <Sign:1>
    in time with the enemies' attacks. (Don't enter
    a fighting stance with <Sign:4>.)
  fr: 'Pris entre deux ennemis, pressez <Sign:1> au moment

    de l''attaque. (Ne vous mettez pas en garde

    avec <Sign:4>.)            '
- id: sys_press_sign0_near_an
  en: |-
    Press <Sign:0> near an enemy to grab them.

    If an enemy is guarding to block your attacks, grab
    them and then attack to deal damage.
  fr: |-
    Pressez <Sign:0> près d'un ennemi pour le saisir.

    S'il bloque vos attaques, attrapez-le puis
    frappez pour lui infliger des dégâts.
- id: sys_evade_an_enemys_attack
  en: |-
    Evade an enemy's attack, then smash the bones
    in their leg. This strike is enough to make
    any troublemaker regret getting out of bed.
  fr: 'Esquivez l''attaque ennemie et brisez-lui la jambe.

    Ce coup net et précis fera regretter à tout voyou

    d''avoir cherché la bagarre.   '
- id: sys_a_new_move_occurred
  en: |-
    A new move occurred to you during your bout with
    Komeki! This precise strike is unleashed after a
    Quickstep.

    Practice it against Komeki.
  fr: |-
    Un nouveau coup vous vient face à Komeki !
    Cette attaque précise se déclenche après une
    esquive rapide.

    Pratiquez-la sur Komeki.
- id: sys_press_sign1_close_to
  en: |-
    Press <Sign:1> close to an enemy on the ground.
    The time an enemy stays down varies depending on
    the attack used, so choose your attacks carefully.
  fr: 'Pressez <Sign:1> près d''un ennemi au sol.

    Le temps au sol dépend du coup porté, choisissez

    donc vos attaques avec discernement.         '
- id: sys_practice_complete_however_your
  en: |-
    Practice complete!

    However, your bout against Komeki is not over.
    Use your new move and more to defeat Komeki
    and perfect your mastery of the attack.
  fr: |-
    Entraînement réussi !

    Mais le duel contre Komeki continue. Utilisez
    ce nouveau coup pour vaincre Komeki et parfaire
    votre maîtrise du combat.
- id: sys_a_new_move_occurred_1
  en: |-
    A new move occurred to you during your bout with
    Komeki!

    Parry an enemy's attack and deal a solid chop
    to their brainstem.

    Practice it against Komeki.
  fr: 'Un coup vous vient lors du duel avec Komeki !


    Parez l''attaque et assénez un coup sec à la base

    du crâne.


    Pratiquez-le contre Komeki.        '
- id: sys_a_new_move_occurred_2
  en: |-
    A new move occurred to you during your bout with
    Komeki!

    This move lets you escape from an enemy
    grapple and launch a counterattack.

    Practice it against Komeki.
  fr: 'Un coup vous vient lors du duel avec Komeki !


    Ce mouvement vous dégage d''une prise pour riposter

    aussitôt.


    Pratiquez-le contre Komeki.                 '
- id: sys_a_new_move_occurred_3
  en: |-
    A new move occurred to you during your bout with
    Komeki!

    You can transition directly into an attack
    after being struck by the enemy.


    Practice it against Komeki.
  fr: 'Un coup vous vient lors du duel avec Komeki !


    Vous pouvez enchaîner directement sur une attaque

    après avoir été touché par l''ennemi.


    Pratiquez-le contre Komeki. '
- id: sys_press_sign2_while_near
  en: |-
    Press <Sign:2> while near a large weapon showing a
    <Sign:23> mark to automatically pick it up and
    swing it. This is called an auto weapon attack.

    Bash an enemy with an auto weapon attack.
  fr: 'Pressez <Sign:2> près d''une arme lourde avec <Sign:23>

    pour la ramasser et frapper automatiquement.

    C''est l''attaque d''arme automatique.


    Frappez un ennemi avec une arme auto.   '
- id: sys_the_first_law_of
  en: |-
    The First Law of Management

    "The Customer is King." Even if punched or kicked,
    reprisal is out of the question.

    For now, watch for the customer to make a move,
    and evade their attacks using <Sign:3>.
  fr: '1re règle de gestion


    " Le client est roi. " Même frappé, toute riposte

    est exclue.


    Observez les mouvements du client et esquivez

    ses attaques en utilisant <Sign:3>.       '
- id: sys_thug_style_incorporates_a
  en: |-
    Thug style incorporates a number of merciless
    attacks. One of these is the eye poke attack.

    If you land an eye poke attack, the enemy will
    turn their back to you in pain. Show Komeki
    your Thug style moves.
  fr: 'Le style Voyou compte des coups sans pitié.

    Parmi eux, l''attaque aux yeux.


    Si elle touche, l''ennemi se retourne de douleur.

    Montrez vos mouvements de Voyou à Komeki.      '
- id: sys_press_sign1_during_a_1
  en: |-
    Press <Sign:1> during a <Sign:2> combo attack to perform
    a Finishing Blow that knocks the enemy down.
    The knockdown effect varies depending on the number of
    times <Sign:2> was pressed, so try it in a few ways.
  fr: 'Pressez <Sign:1> pendant un combo <Sign:2> pour un coup

    de grâce qui renverse l''ennemi.

    L''effet varie selon le nombre de coups <Sign:2>,

    essayez différentes combinaisons.          '
- id: sys_try_mastering_the_strong
  en: |-
    Try mastering the strong defensive potential
    that a bat offers.

    When you guard using a weapon, you are less likely
    to be staggered by an attack. Use a bat to protect
    yourself against Fei Hu's vicious assault.
  fr: 'Maîtrisez la grande défense qu''offre une batte.


    En parant avec une arme, vous risquez moins d''être

    déstabilisé. Utilisez la batte pour vous protéger

    face aux assauts violents de Fei Hu.   '
- id: sys_one_of_the_special
  en: |-
    One of the special moves of the Thug style
    is a Heat Action called the Essence of Choking.

    This Heat Action triggers when an enemy attacks you
    or when you circle around behind them.

    Show Komeki your Thug style special move.
  fr: 'Un coup spécial du style Voyou est l''Action

    Furia nommée Essence de l''étranglement.


    Elle s''active quand l''ennemi attaque ou quand

    vous passez dans son dos.


    Montrez ce coup spécial à Komeki.        '
- id: sys_you_learned_the_breaker_1
  en: |-
    You learned the Breaker style!

    This fighting style focuses on spinning combo attacks
    that incorporate breakdancing moves.

    Many enemies will be caught off guard and felled by
    your stylish steps before they know what hit them.
  fr: 'Vous apprenez le style Danseur !


    Ce style mise sur des combos tourbillonnants issus

    du breakdance.


    Les ennemis seront déroutés et terrassés par vos

    pas rythmés avant même de réagir.            '
- id: sys_a_new_move_occurred_4
  en: |-
    A new move occurred to you during your bout with
    Komeki!

    Successfully guarding with Heat Gauge at 1st bar
    causes the Heat Gauge to rise, and you are not
    staggered by anything but knives and bullets.


    Practice it against Komeki.
  fr: 'Un coup vous vient lors du duel avec Komeki !


    Bloquer avec 1 barre de Furia augmente la jauge,

    et rien sauf couteaux et balles ne peut vous

    déstabiliser.


    Pratiquez-le contre Komeki.        '
- id: sys_one_advantage_of_the
  en: |-
    One advantage of the Rush style is you can evade with
    a series of Quicksteps by pressing <Sign:3> repeatedly.
    You can combo up to three of them together.

    Use this to avoid enemy attacks and wipe them out
    without taking any damage.
  fr: 'L''atout du style Rush est d''esquiver en série via

    <Sign:3>. Enchaînez jusqu''à trois esquives d''affilée.


    Utilisez cela pour éviter les assauts ennemis et les

    éliminer sans subir le moindre dégât.          '
- id: sys_once_the_heat_gauge
  en: |-
    Once the Heat Gauge shifts to the 2nd or 3rd bar,
    Kiryu's body begins to glow with a blue aura.

    This is called Heat Mode, and it signals that you
    can use special Heat Actions.

    Try using Heat Actions while sobering up the
    drunkards.
  fr: 'À la 2e ou 3e barre de Furia, le corps de Kiryu

    s''illumine d''une aura bleue.


    C''est le Mode Furia, indiquant que vous pouvez

    lancer des Actions Furia dévastatrices.


    Testez les Actions Furia sur les ivrognes.    '
- id: sys_the_second_law_of
  en: |-
    The Second Law of Management

    "The Customer is King." Even in the worst of times,
    you must never forget to provide only the finest
    service possible.

    Patience shall be rewarded, as now it is time to
    show all your customers the ultimate in hospitality.
  fr: '2e règle de gestion


    " Le client est roi. " Même au pire moment, vous

    devez offrir un service impeccable.


    La patience est récompensée : offrez à vos clients

    une hospitalité incomparable.                        '
- id: sys_pull_off_an_extra
  en: |-
    Pull off an extra attack from a Freeze Pose!

    Trigger a <Sign:2> attack followed by a <Sign:1> combo
    attack to finish with a Freeze Pose.

    From this pose you can unleash an additional attack--
    a Finishing Blow called the Double Breaker.

    See if you can pull off a Freeze Pose.
  fr: 'Lancez une attaque bonus depuis une pose figée !


    Enchaînez <Sign:2> puis <Sign:1> pour finir en pose

    figée.


    De là, portez un coup supplémentaire :

    le coup de grâce Double Danseur.


    Réussissez une pose figée.             '
- id: sys_use_rush_style_moves
  en: 'Use Rush style moves to crush Bruno and show him

    who''s boss.


    When using the Rush style, you can stun enemies by

    hitting them a certain number of times.


    Attacks on stunned enemies will knock them down

    without fail, so <Sign:2> attacks are effective

    against foes that are hard to knock to the ground. '
  fr: 'Utilisez le style Rush pour corriger Bruno.


    Le style Rush permet d''étourdir l''ennemi en le

    touchant un certain nombre de fois.


    Les coups sur ennemi étourdi le renversent à coup

    sûr, les attaques <Sign:2> sont donc idéales contre

    les adversaires durs à mettre à terre.           '
- id: sys_you_learned_the_slugger_1
  en: |-
    You learned the Slugger style!
    This fighting style focuses on the use of bats.
    The bat boosts your offensive potential, while also
    providing more defense than your bare hands.

    The variety of swings, thrusts, and spins you can
    perform with a bat gives you a range of options
    that rivals or surpasses other weapons.
  fr: 'Vous apprenez le style Batteur !

    Ce style repose sur le maniement de la batte.

    La batte décuple votre attaque tout en offrant

    une meilleure défense que vos mains nues.


    La variété de frappes et tourbillons à la batte

    vous donne un éventail de coups surpassant bien

    d''autres armes.                     '
- id: sys_you_learned_the_rush_2
  en: |-
    You learned the Rush style!
    This fighting style focuses on speed.
    Run rings around the enemy with <Sign:2> attack combos
    and <Sign:3> evasion combos.

    You can stun enemies by striking them with a series of
    swift, precise, Rush style attacks. Pummeling stunned
    enemies with blows will do more damage to them than
    usual.
  fr: 'Vous apprenez le style Rush !

    Ce style repose entièrement sur la vitesse.

    Tournez autour de l''ennemi avec combos <Sign:2>

    et esquives <Sign:3>.


    Étourdissez l''ennemi d''une série de coups rapides.

    Frapper un ennemi étourdi lui inflige bien plus

    de dégâts que la normale.                      '
- id: sys_the_three_blue_glowing
  en: |-
    The three blue, glowing bars on the top left are called
    the Heat Gauge.

    The Heat Gauge starts at 1st bar, and as your attacks
    hit enemies, the gauge fills up, shifting to the 2nd
    then 3rd bar.

    At each level your speed increases. Some moves
    require a certain level of Heat, so once you are
    used to fighting, keep an eye on your Heat level.
  fr: 'Les trois barres bleues en haut à gauche forment la

    jauge de Furia.


    Elle démarre à 1 et se remplit à mesure que vous

    touchez l''ennemi, passant au niveau 2 puis 3.


    Chaque niveau augmente votre vitesse. Certains coups

    exigent un seuil de Furia, surveillez donc votre jauge

    en combat régulier.                              '
- id: sys_the_yellow_gauge_on
  en: |-
    The yellow gauge on the top left indicates your
    health. The game will end if the yellow part is fully
    depleted, so keep an eye on your health at all times.

    If the gauge flashes red, it means you're in very bad
    shape and should replenish your health immediately.

    Health recovery methods:
     - Use a recovery item
     - Eat something at an eatery
  fr: "La jauge jaune en haut à gauche indique votre santé.\nLa partie prend fin si\
    \ elle est vide, gardez un oeil\ndessus en permanence.\n\nSi la jauge clignote\
    \ en rouge, soignez-vous vite.\n\nMoyens de récupération :\n - Utiliser un soin\
    \ de l'inventaire\n - Manger dans un restaurant                     "
- id: sys_you_learned_the_beast_1
  en: 'You learned the Beast style!

    This fighting style focuses on power. It gets its

    name from the animalistic fury unleashed as you

    demolish all in your path, swinging enemy and weapon

    alike.


    It also adds extra resistance to the guard

    ability, making you immune to knockdowns from

    ordinary attacks. Use this style to wreak havoc

    while staying on your feet. '
  fr: 'Vous apprenez le style Beast !

    Ce style repose sur la force brute et la furie

    animale qui détruit tout sur son passage, projetant

    ennemis et objets.


    Il renforce aussi la garde, vous immunisant contre

    les renversements des coups ordinaires. Semez le chaos

    tout en restant debout.                                 '
- id: sys_your_training_is_now_1
  en: |-
    Your training is now complete.
    That concludes the explanation of the Heat Gauge
    and special moves, but the two drunkards still need
    some sobriety beaten into them.

    If you take a fighting stance using <Sign:4>, movement
    with <Sign:45> will center around the enemy in front of
    you. This is effective when you want to focus your
    attacks on a single enemy.
  fr: 'Entraînement terminé.

    Voilà pour la jauge de Furia et les coups spéciaux,

    mais ces deux ivrognes ont encore besoin d''une bonne

    leçon pour dessoûler.


    En garde <Sign:4>, les déplacements <Sign:45> se

    centrent sur l''ennemi en face de vous, idéal pour

    concentrer vos attaques sur une seule cible.          '
- id: sys_your_training_is_now_2
  en: |-
    Your training is now complete. It's time to wipe
    the smirks off your opponents' faces.

    If you get hit, you can strike back right away using
    <Sign:2>, <Sign:1>, or <Sign:0>. This is called a Resolute Counter.

    You can gain money by knocking down or defeating
    enemies. Depending on how you do it, you might get a
    bonus too, so try a range of different moves.
  fr: |-
    Entraînement terminé. Effacez ce sourire narquois du
    visage de vos adversaires.

    Si vous êtes touché, ripostez aussitôt avec <Sign:2>,
    <Sign:1> ou <Sign:0>. C'est la Riposte résolue.

    Terrasser un ennemi rapporte de l'argent avec des
    bonus selon votre style de combat. Variez vos coups !
- id: sys_mr_shakedown_is_an
  en: |-
    Mr. Shakedown is an arrogant bully who roams
    around town. He overwhelms victims with his massive
    physique and power, then robs them of their money
    before disappearing.

    When you battle Mr. Shakedown there are some
    special rules. Each time you land a blow you'll
    receive money, but each you get hit you'll lose some.
    Be very careful when you go up against him!
  fr: |-
    M. Shakedown est un colosse arrogant qui écume la
    ville. Il écrase ses victimes de sa force herculéenne
    et leur dérobe tout leur argent avant de disparaître.

    Le combat contre lui obéit à des règles spéciales :
    chaque coup porté rapporte de l'argent, chaque coup
    reçu vous en fait perdre. Soyez extrêmement prudent !
- id: sys_when_using_beast_style
  en: |-
    When using Beast style, holding <Sign:6> to guard lets
    you withstand enemy attacks with the Resist Guard.
    You will take a certain amount of damage, but you are
    protected against attacks coming from any direction.

    Bolstering your defense by equipping gear in the
    Pause menu further reduces the damage you take with
    Resist Guard. Be sure to equip any gear you find.
  fr: 'En style Beast, maintenir <Sign:6> déclenche la Garde

    résistante. Vous subissez quelques dégâts légers mais

    êtes protégé des attaques de toutes directions.


    Équiper des protections via le menu Pause réduit encore

    les dégâts subis en Garde résistante. Pensez à équiper

    tout équipement trouvé en ville.                      '
