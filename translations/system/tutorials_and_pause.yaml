- id: sys_a_french_aristocrat_who
  en: |-
    A French aristocrat who claims to be a direct
    descendant of the Marquis de Sade. He finds pleasure
    in causing pain to others, and entered the Bed of Styx
    specifically to satisfy his sadistic desires.
  fr: |-
    Un aristocrate français affirmant être le descendant
    direct du marquis de Sade. Il ne tire son plaisir que
    de la souffrance d'autrui et est entré au Lit du Styx
    pour assouvir ses pulsions sadiques.
- id: sys_a_bicycle_courier_who
  en: |-
    A bicycle courier who used his speed to commit
    snatch-and-run robberies. Wajima became known as the
    fastest thief in Tokyo.
  fr: |-
    Un coursier à vélo exploitant sa pointe de vitesse pour
    commettre des vols à l'arraché. Wajima est vite devenu le
    voleur le plus rapide de Tokyo.
- id: sys_a_circus_filled_with
  en: |-
    A circus filled with the sort of clowns that give children nightmares. The shows staged
    here display never-before-seen levels of aggression and unprecedented ultraviolence.
  fr: |-
    Un cirque rempli de bouffons tout droit sortis de cauchemars d'enfants.
    Les spectacles donnés ici atteignent des sommets d'agressivité et d'ultraviolence inouïe.
- id: sys_a_con_artist_who
  en: |-
    A con artist who targeted wealthy widows, marrying
    them before murdering them for their fortunes.
    Tatsuarashi was caught after his seventh victim.
  fr: |-
    Un escroc ciblant de riches veuves, les épousant avant
    de les assassiner pour capter leur héritage.
    Tatsuarashi a été démasqué après sa septième victime.
- id: sys_a_con_man_and
  en: |-
    A con man and master of disguise who stole the
    identities of over twenty high-ranking officials
    before being captured.
  fr: |-
    Un escroc et maître du déguisement ayant usurpé
    l'identité de plus d'une vingtaine de hauts dignitaires
    avant d'être appréhendé.
- id: sys_a_cook_who_used
  en: |-
    A cook who used his restaurant as a cover for
    his cannibalistic meals. He served meat from his
    victims to unsuspecting customers, until a skull
    was found in the restaurant kitchen.
  fr: |-
    Un chef cuisinier utilisant son restaurant comme vitrine
    pour ses repas cannibales. Il servait la chair de ses
    victimes aux clients à leur insu, jusqu'à ce qu'un crâne
    soit découvert dans les cuisines.
- id: sys_a_doctor_who_used
  en: |-
    A doctor who used his patients as guinea pigs for
    his experiments. He was also involved in black
    market human organ trafficking, and used his profits
    to build a vast fortune before being caught.
  fr: |-
    Un médecin utilisant ses patients comme cobayes
    pour ses expériences. Il a également trempé dans le
    trafic d'organes au marché noir, bâtissant une immense
    fortune avant d'être finalement démasqué.
- id: sys_a_former_cop_who
  en: |-
    A former cop who abused his power to shake down
    innocent people. When a yakuza mob took revenge on
    him by killing his family, Tsuji massacred them all
    while drunk. Feared for his extreme ruthlessness.
  fr: |-
    Ex-policier ayant abusé de son pouvoir pour racketter
    des innocents. Quand un clan yakuza s'est vengé en tuant
    sa famille, Tsuji les a tous massacrés sous l'emprise
    de l'alcool. Célèbre pour son impitoyable cruauté.
- id: sys_a_former_cop_who_1
  en: |-
    A former cop who got his revenge by killing the
    underworld gang that took the lives of his wife and
    child. He is a master of escaping prison, having
    broken out from every facility he was locked up in
    up to now.
  fr: |-
    Un ex-policier s'étant vengé en éliminant le gang qui
    avait ôté la vie à sa femme et son enfant. Passé maître
    dans l'art de l'évasion, il s'est échappé de toutes
    les prisons où il a été incarcéré jusqu'à présent.
- id: sys_a_former_mystery_writer
  en: |-
    A former mystery writer who decided to commit the
    crimes he wrote about in real life. Ogasawara claims
    every crime he committed was a work of art.
  fr: |-
    Ancien auteur de romans policiers ayant décidé de
    perpétrer ses crimes fictifs dans la vie réelle.
    Ogasawara affirme que chacun de ses meurtres était
    une véritable oeuvre d'art.
- id: sys_a_former_superhero_tv
  en: |-
    A former superhero TV actor who developed a god
    complex. He believes he is genuinely cleansing the
    world of evil through violence.
  fr: |-
    Un ancien acteur de séries de super-héros ayant sombré
    dans le complexe du messie. Il est convaincu de purifier
    le monde du mal par la violence la plus pure.
- id: sys_a_grave_robber_who
  en: |-
    A grave robber who collected parts from human
    bodies. His house was found to be filled with
    preserved body parts when police raided it.
  fr: |-
    Un pilleur de tombes collectionnant des morceaux de corps
    humains. Lors de la perquisition policière, sa demeure
    s'est révélée regorger d'organes conservés dans des bocaux.
- id: sys_a_hellhole_forsaken_by
  en: |-
    A hellhole forsaken by heaven but not by the devil, who throws down helpful "gifts" to
    the contenders. All he wants in return is to hear their mad screams of pain and anguish.
  fr: |-
    Un trou à rats abandonné des dieux mais pas du diable, qui octroie de précieux « cadeaux »
    aux combattants. En échange, il ne réclame que leurs hurlements d'agonie et de terreur.
- id: sys_a_hitman_who_works
  en: |-
    A hitman who works while disguised as a clown.
    He is known to dance while shooting his victims,
    treating assassinations as stage performances.
  fr: |-
    Un tueur à gages opérant sous les traits d'un clown.
    Il est réputé pour danser tout en abattant ses victimes,
    traitant chaque meurtre comme un spectacle de scène.
- id: sys_a_legendary_undefeated_underground
  en: |-
    A legendary, undefeated underground fighter who was
    sent to the Bed of Styx when he killed his opponent
    in the ring. Puncher has an extremely high pain
    threshold, and doesn't flinch even if stabbed.
  fr: |-
    Combattant clandestin de légende invaincu, envoyé au
    Lit du Styx après avoir tué son adversaire sur le ring.
    Puncher a une tolérance à la douleur si élevée qu'il
    ne cille même pas sous les coups de couteau.
- id: sys_a_mercenary_active_in
  en: |-
    A mercenary active in battlefields all around the
    globe, G.J. hates all human beings equally. He has
    killed so many people he lost count, and is wanted
    in numerous countries. He is rumored to have entered
    the Bed of Styx just to seek strong opponents.
  fr: |-
    Mercenaire ayant écumé les champs de bataille du monde
    entier, G.J. voue une haine égale à tout le genre humain.
    Ayant tué tellement de gens qu'il en a perdu le compte,
    il est entré au Styx uniquement pour trouver des rivaux.
- id: sys_a_mysterious_contender_with
  en: |-
    A mysterious contender with huge potential.
    Nothing is known about the crimes he's guilty of,
    and he doesn't seem to have a set fighting style
    either. Like the dragon tattoo on his back, his
    fighting skills still seem to be developing.
  fr: |-
    Un mystérieux combattant au potentiel titanesque.
    On ignore tout des crimes dont il est coupable,
    et il ne semble avoir aucun style prédéfini.
    À l'image du dragon tatoué sur son dos, ses
    talents martiaux semblent encore en plein essor.
- id: sys_a_poacher_who_hunted
  en: |-
    A poacher who hunted endangered animals before
    turning his attention to hunting human beings.
    Gondo treats every fight like a safari hunt.
  fr: |-
    Un braconnier ayant traqué des espèces menacées avant
    de se tourner vers la chasse à l'homme.
    Gondo aborde chaque combat comme un safari grandeur nature.
- id: sys_a_politician_who_used
  en: |-
    A politician who used bribery and violence to win
    elections. When his crimes were brought to light,
    he attempted to hire a hitman to kill the prosecutor
    handling his case.
  fr: |-
    Un politicien ayant usé de corruption et de violence
    pour remporter ses élections. Quand l'affaire a éclaté,
    il a tenté d'engager un tueur à gages pour abattre
    le procureur en charge du dossier.
- id: sys_a_stage_for_seasoned
  en: |-
    A stage for seasoned fighters who have pleased the crowd with many brutal performances.
    But even these tough contenders are known to beg for mercy when death approaches.
  fr: |-
    Une arène pour combattants chevronnés ayant conquis la foule par leur brutalité.
    Pourtant, même ces durs à cuire supplient qu'on les épargne quand la mort approche.
- id: sys_a_stage_for_weapon
  en: |-
    A stage for weapon connoisseurs. You may still fight bare-handed, of course, provided
    you can dish out some moves that will make the audience (and your opponent) scream.
  fr: |-
    Une arène pour connaisseurs d'armes blanches. Le combat à mains nues reste permis,
    à condition d'asséner des coups capables de faire hurler la foule et votre adversaire.
- id: sys_a_thief_and_murderer
  en: |-
    A thief and murderer sentenced to death, he
    somehow managed to survive the hanging. It was
    legally impossible to repeat the execution, and
    the police feared he'd go on another killing spree
    if released, so they sent him here instead.
  fr: |-
    Voleur et meurtrier condamné à mort, il a miraculeusement
    survécu à la pendaison. La loi interdisant une seconde
    exécution et la police redoutant un nouveau carnage
    s'il était libéré, il a été envoyé ici.
- id: sys_a_weapons_supplier_who
  en: |-
    A weapons supplier who would sell to anyone, as
    long as the price was right. He became hated by both
    armies in an African civil war, who ended up teaming
    up to sell him into the Bed of Styx. Abbas is an
    experienced fighter who knows how to use every
    weapon in his collection.
  fr: |-
    Un marchand d'armes prêt à vendre à quiconque au juste
    prix. Haï par les deux camps d'une guerre civile africaine,
    ces derniers se sont unis pour le vendre au Lit du Styx.
    Abbas maîtrise parfaitement chaque arme de sa collection.
- id: sys_abhorrent_assassin
  en: Abhorrent Assassin
  fr: Assassin abominable
- id: sys_abyssal_romp
  en: Abyssal Romp
  fr: Ébat abyssal
- id: sys_accidental_murder
  en: Accidental(?) Murder
  fr: Meurtre accidentel (?)
- id: sys_adv_duelist_fiend_frolic
  en: 'Adv. Duelist: Fiend Frolic'
  fr: 'Duelliste avancé : Festin pernicieux'
