- id: sys_nicknamed_birdman_tobiyama_has
  en: |-
    Nicknamed "Birdman," Tobiyama has possibly the
    highest number of successful prison breaks on his
    record. Prison escapes are something of a hobby
    for him, so he commits crimes just to get in. When
    a prison warden committed suicide, unable to bear
    the ridicule after yet another escape, his peers
    arranged to have Tobiyama sent to the Bed of Styx.
  fr: |-
    Surnommé « Birdman », Tobiyama détient sans doute le record
    d'évasions réussies. S'évader est un passe-temps
    pour lui, au point de commettre des délits juste pour être incarcéré.
    Après le suicide d'un directeur de prison humilié par une
    évasion de trop, les gardiens se sont arrangés pour
    l'envoyer pourrir au Lit du Styx.
