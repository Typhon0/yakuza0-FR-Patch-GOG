    limites de son corps. Il testait sa force en tuant
    des innocents, jusqu'à ce que les familles de ses
    victimes précipitent son fourgon pénitentiaire dans
    la mer d'Okhotsk. Aperçu vivant plus tard à Hokkaido,
    on murmure que la plupart des attaques d'ours dans
    la région étaient en fait son oeuvre.
