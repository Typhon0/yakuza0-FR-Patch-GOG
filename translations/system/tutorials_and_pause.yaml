- id: sys_1_defeat_opponents_in
  en: '1. Defeat opponents in three fights to win the tournament.


    2. 30% of max HP is restored in between fights.


    3. Prize money is won for each defeated opponent.

    '
  fr: '1. Battez 3 adversaires consécutifs pour remporter le tournoi.


    2. 30 % de vos PV max sont restaurés entre chaque combat.


    3. Une prime est remportée pour chaque adversaire vaincu.

    '
- id: sys_1_you_can_continue
  en: "1. You can continue fighting as long as you have HP left.\n\n2. You can pay\
    \ to restore HP between fights.\n\n3. Prize money is won for each defeated opponent.\n\
    \n4. After each five fights won, you can choose whether to continue.\n\n5. The\
    \ rule set changes every five battles.\nã\x80\x80"
  fr: '1. Vous continuez à combattre tant qu''il vous reste des PV.


    2. Vous pouvez payer pour récupérer des PV entre les combats.


    3. Une prime est remportée pour chaque adversaire vaincu.


    4. Tous les 5 combats gagnés, vous pouvez choisir de continuer.


    5. Les règles changent tous les 5 combats.

    '
